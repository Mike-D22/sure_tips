<!--
  SYNTHETIC PARSER FIXTURE - not a captured page, not a Django loaddata fixture.
  Target parser : alltips_scraper.utils.parse_card (via the page parsers)
  Purpose       : one card has an unparseable option.active stake value, which makes
                  parse_card raise on float() and discard the WHOLE card, including
                  its otherwise-valid legs. The sibling card must survive untouched.
  See fixtures/README.md for provenance and the refresh procedure.
  Contains no credentials, no personal data, no payment data.
-->

          <div class="Img Team Team--xs" style="background-image:url(&amp;quot;/wp-content/themes/freesupertips/image/team/Liverpool.png&amp;quot;)"></div>

      </div>

      <div class="BetGrid">
        <select aria-label="select your stake">

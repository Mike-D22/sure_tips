<!--
  SYNTHETIC PARSER FIXTURE - not a captured page, not a Django loaddata fixture.
  Target parser : alltips_scraper.utils.parse_card (via the page parsers)
  Purpose       : pins the thousands-separator branch of the returns regex
                  (r'[\d,]+\.?\d*' with ',' stripped). A comma-bearing amount
                  returns 2856.9 against a 2000 stake, i.e. derived odds 1.43.
  See fixtures/README.md for provenance and the refresh procedure.
  Contains no credentials, no personal data, no payment data.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Comma returns (synthetic fixture)</title>
</head>
<body>
  <div class="Wrapper">

    <div class="Card">
      <header class="TipHeader">
        <h2>High Stakes Single</h2>
      </header>

      <div class="Leg">
        <time datetime="2026-09-27T19:45">19:45</time>
        <div class="Teams">
          <div class="Img Team Team--xs" style="background-image:url(&amp;quot;/wp-content/themes/freesupertips/image/team/Liverpool.png&amp;quot;)"></div>
          <div class="Img Team Team--xs" style="background-image:url(&amp;quot;/wp-content/themes/freesupertips/image/team/Manchester%20United.png&amp;quot;)"></div>
        </div>
        <div class="Leg__title">
          <div class="Leg__win">Liverpool to win</div>
          <div class="Leg__lose">vs Manchester United</div>
        </div>
      </div>

      <div class="BetGrid">
        <select aria-label="select your stake">
          <option value="10">&#163;10</option>
          <option class="active" value="2000">&#163;2,000</option>
        </select>
        <div class="BetGrid__returns">&#163;2,856.90</div>
      </div>
    </div>

  </div>
</body>
</html>
